<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowLite – Live orders</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.4rem; }
    .bar { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    select, button { font: inherit; padding: .4rem .8rem; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; }
    button.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    #status { font-size: .9rem; color: #64748b; margin-bottom: .5rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: .45rem .6rem; border-bottom: 1px solid #e5e7eb; font-family: ui-monospace, monospace; font-size: .85rem; }
    .done, .completed { color: #15803d; } .failed { color: #b91c1c; } .compensated { color: #b45309; } .processing { color: #2563eb; }
  </style>
</head>
<body>
  <h1>🩻 FlowLite – Live orders</h1>
  <div class="bar">
    <select id="key">
      <option value="demo-key-amina">Dr. Amina Clinic</option>
      <option value="demo-key-berlin">Berlin Chest Center</option>
    </select>
    <button class="primary" id="connect">Connect</button>
    <button id="ok">Place order</button>
    <button id="fail">Place failing order</button>
  </div>
  <div id="status">Not connected</div>
  <ul id="events"></ul>

  <script>
    const $ = (id) => document.getElementById(id);
    let socket;

    function show(text, cls) {
      const li = document.createElement('li');
      li.textContent = new Date().toLocaleTimeString() + '  ' + text;
      if (cls) li.className = cls;
      $('events').prepend(li);
    }

    $('connect').onclick = () => {
      if (socket) socket.close();
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${proto}://${location.host}/live?apiKey=${$('key').value}`);
      socket.onmessage = (msg) => {
        const e = JSON.parse(msg.data);
        if (e.type === 'connected') $('status').textContent = 'Connected as ' + e.tenantId;
        else if (e.type === 'order.step') show(`order ${e.orderId}  ${e.step}: ${e.status}`, e.status);
        else if (e.type === 'order.status') show(`order ${e.orderId}  STATUS ${e.status}`, e.status);
      };
      socket.onclose = () => ($('status').textContent = 'Disconnected');
    };

    async function place(body) {
      const res = await fetch('/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Api-Key': $('key').value },
        body: JSON.stringify(body),
      });
      if (res.status >= 500 || res.status === 400 || res.status === 401) show('request error ' + res.status, 'failed');
    }
    $('ok').onclick = () => place({ sku: 'xray-scan', qty: 1, amount: 5 });
    $('fail').onclick = () => place({ sku: 'xray-scan', qty: 1, amount: 5, simulateFail: 'shipping' });
  </script>
</body>
</html>
